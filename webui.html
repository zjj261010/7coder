<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7coder</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e6e9ef; --dim:#8b93a3; --acc:#4f8cff; --user:#2b5fd9; --err:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  .chip { font-size:12px; color:var(--dim); background:#1d222c; border:1px solid var(--line); border-radius:10px; padding:2px 10px; max-width:340px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .spacer { flex:1; }
  #key { background:#10131a; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:5px 8px; font-size:12px; width:180px; }
  button { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:6px 14px; font-size:13px; cursor:pointer; }
  button.ghost { background:#1d222c; color:var(--fg); border:1px solid var(--line); }
  button:disabled { opacity:.45; cursor:default; }
  #log { flex:1; overflow-y:auto; padding:18px 16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:86%; padding:10px 14px; border-radius:12px; line-height:1.65; font-size:14px; white-space:pre-wrap; word-break:break-word; }
  .user { align-self:flex-end; background:var(--user); }
  .bot  { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .err  { align-self:center; background:#2a1518; border:1px solid var(--err); color:var(--err); font-size:13px; }
  .sys  { align-self:center; color:var(--dim); font-size:12px; }
  .bot pre { background:#0c0e13; border:1px solid var(--line); border-radius:8px; padding:10px; overflow-x:auto; white-space:pre; font-size:13px; }
  .bot code { font-family:Consolas,"Courier New",monospace; }
  .cursor { display:inline-block; width:8px; height:16px; background:var(--acc); animation:blink 1s steps(1) infinite; vertical-align:-3px; }
  @keyframes blink { 50% { opacity:0; } }
  footer { padding:12px 16px; background:var(--panel); border-top:1px solid var(--line); }
  #row { display:flex; gap:10px; align-items:flex-end; }
  textarea { flex:1; resize:none; background:#10131a; color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; font-family:inherit; min-height:44px; max-height:180px; }
  textarea:focus { outline:1px solid var(--acc); }
  #hint { font-size:11px; color:var(--dim); margin-top:6px; }
  #status { font-size:12px; color:var(--dim); min-height:16px; margin-bottom:6px; }
</style>
</head>
<body>
<header>
  <h1>7coder</h1>
  <select id="modelSel" title="切换模型（多端点/多密钥见 models.json）" style="background:#10131a;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:12px;max-width:220px;"></select>
  <span class="chip" id="model">…</span>
  <span class="chip" id="ws" title="工作区（AI 的文件操作都在此目录内）"></span>
  <span class="chip" id="mode" title="权限模式：default=操作前询问；auto=轻量模型自动放行；bypass=全部直接执行（危险）；denial=全部拒绝"></span>
  <select id="modeSel" title="切换权限模式" style="background:#10131a;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:12px;">
    <option value="">权限模式…</option>
    <option value="default">default · 操作前询问</option>
    <option value="auto">auto · 自动放行</option>
    <option value="bypass">bypass · 全部直接执行（危险）</option>
    <option value="denial">denial · 全部拒绝</option>
  </select>
  <span class="spacer"></span>
  <button class="ghost" id="openWs" title="在服务器上打开工作区文件夹">📁 工作区</button>
  <button class="ghost" id="openCfg" title="打开配置文件（.env）">⚙ 配置</button>
  <button class="ghost" id="hist">历史会话</button>
  <button class="ghost" id="settingsBtn" title="配置端点/密钥/模型（写入工作区 .env 与 models.json）">模型设置</button>
  <input id="key" type="password" placeholder="API Key（未设可留空）" autocomplete="off">
  <button class="ghost" id="new">新会话</button>
</header>
<div id="setPanel" style="display:none; background:var(--panel); border-bottom:1px solid var(--line); padding:12px 16px; max-height:340px; overflow-y:auto; font-size:13px;">
  <strong>全局设置（写入工作区 .env，重启后仍生效）</strong>
  <div style="display:grid; grid-template-columns: 130px 1fr; gap:6px 10px; margin:8px 0; align-items:center;">
    <span>Endpoint</span><input id="setEndpoint" style="background:#10131a;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;">
    <span>API Key</span><input id="setKey" type="password" style="background:#10131a;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;" placeholder="留空 = 无密钥本地服务">
    <span>主模型</span><input id="setModel" style="background:#10131a;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;">
  </div>
  <button id="saveSettings">保存全局设置</button>
  <hr style="border:0;border-top:1px solid var(--line);margin:12px 0;">
  <strong>模型 Profiles（各自独立端点/密钥，写入 models.json）</strong>
  <div id="profRows" style="margin:8px 0;"></div>
  <button class="ghost" id="addProf" style="font-size:12px;">＋添加模型</button>
  <button id="saveProfiles" style="margin-left:8px;">保存 Profiles</button>
</div>
<div id="histPanel" style="display:none; background:var(--panel); border-bottom:1px solid var(--line); padding:10px 16px; max-height:260px; overflow-y:auto;">
  <div style="display:flex; gap:10px; align-items:center; margin-bottom:8px;">
    <strong style="font-size:13px;">历史会话</strong>
    <button class="ghost" id="saveSess" style="font-size:12px; padding:3px 10px;">保存当前会话</button>
    <button class="ghost" id="closeHist" style="font-size:12px; padding:3px 10px;">关闭</button>
  </div>
  <div id="histList" style="font-size:13px;"></div>
</div>
<div id="log">
  <div class="sys">已连接 7coder。直接输入中文任务，Enter 发送；工具（写文件/命令等）在服务器端的工作区内执行。</div>
</div>
<footer>
  <div id="status"></div>
  <div id="row">
    <textarea id="ta" rows="1" placeholder="输入任务…（Enter 发送 / Shift+Enter 换行）"></textarea>
    <button id="send">发送</button>
    <button id="stop" class="ghost" disabled>停止</button>
  </div>
  <div id="hint">工具执行可能需要较长时间（编译/测试等），期间可随时点“停止”。</div>
</footer>
<script>
(function () {
  var log = document.getElementById('log');
  var ta = document.getElementById('ta');
  var sendBtn = document.getElementById('send');
  var stopBtn = document.getElementById('stop');
  var statusEl = document.getElementById('status');
  var keyInput = document.getElementById('key');
  var history = [];
  var busy = false;
  var ctrl = null;

  try { keyInput.value = localStorage.getItem('7coder-key') || ''; } catch (e) {}
  keyInput.addEventListener('change', function () { try { keyInput.value ? localStorage.setItem('7coder-key', keyInput.value) : localStorage.removeItem('7coder-key'); } catch (e) {} });

  function headers() {
    var h = { 'Content-Type': 'application/json' };
    if (keyInput.value) h.Authorization = 'Bearer ' + keyInput.value;
    return h;
  }

  function refreshInfo() {
  fetch('/api/info', { headers: headers() }).then(function (r) { return r.json(); }).then(function (info) {
    document.getElementById('ws').textContent = '工作区: ' + (info.workspace || '?');
    var modeSel = document.getElementById('modeSel');
    if (info.mode) {
      modeSel.value = info.mode;
      document.getElementById('mode').textContent = '权限: ' + info.mode;
    }
    // model dropdown
    var modelSel = document.getElementById('modelSel');
    var models = Array.isArray(info.models) && info.models.length ? info.models : [info.model || ''];
    var saved = null;
    try { saved = localStorage.getItem('7coder-model'); } catch (e) {}
    for (var i = 0; i < models.length; i++) {
      var opt = document.createElement('option');
      opt.value = models[i];
      opt.textContent = models[i] + (models[i] === info.model ? '（主）' : '');
      modelSel.appendChild(opt);
    }
    if (saved && models.indexOf(saved) >= 0) modelSel.value = saved;
    else modelSel.value = info.model || models[0];
    modelSel.addEventListener('change', function () {
      try { localStorage.setItem('7coder-model', modelSel.value); } catch (e) {}
      addMsg('sys', '模型已切换为 ' + modelSel.value + '（对下一次发送生效）。');
    });
    if (info.keyRequired) keyInput.placeholder = 'API Key（必填）';
    document.title = '7coder - ' + (info.model || '');
  })
    .catch(function () { document.getElementById('model').textContent = '模型: (info 不可用)'; });
  }
  refreshInfo();


  document.getElementById('modeSel').addEventListener('change', function () {
    var sel = this;
    var mode = sel.value;
    if (!mode) return;
    if (mode === 'bypass' && !confirm('bypass 模式下 AI 的所有操作（含删除文件、执行命令）都不再询问，直接执行。\n确定切换吗？')) {
      sel.value = '';
      return;
    }
    fetch('/api/mode', { method: 'POST', headers: headers(), body: JSON.stringify({ mode: mode }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error((res.j && res.j.error && res.j.error.message) || ('HTTP ' + res.status));
        document.getElementById('mode').textContent = '权限: ' + res.j.mode;
        addMsg('sys', '权限模式已切换为 ' + res.j.mode + '。');
        statusEl.textContent = '';
      })
      .catch(function (e) {
        addMsg('err', '切换失败: ' + e.message);
        sel.value = '';
      });
  });

  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function render(text) {
    var t = esc(text);
    var blocks = [];
    t = t.replace(/```[a-zA-Z0-9]*\n([\s\S]*?)```/g, function (_, code) {
      blocks.push('<pre><code>' + code.replace(/\n$/, '') + '</code></pre>');
      return '\u0000' + (blocks.length - 1) + '\u0000';
    });
    t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    t = t.split('\n').join('<br>');
    t = t.replace(/\u0000(\d+)\u0000/g, function (_, i) { return blocks[+i]; });
    return t;
  }

  function addMsg(cls, html) {
    var d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.innerHTML = html;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  function setBusy(b) {
    busy = b;
    sendBtn.disabled = b;
    stopBtn.disabled = !b;
    ta.focus();
  }

  function send() {
    if (busy) return;
    var text = ta.value.trim();
    if (!text) return;
    ta.value = ''; ta.style.height = 'auto';
    addMsg('user', esc(text));
    history.push({ role: 'user', content: text });
    setBusy(true);
    statusEl.textContent = '思考中 / 工具执行中…';
    var bubble = addMsg('bot', '');
    // 两个独立容器: 思维链 details + 正文 div — 避免 innerHTML 整体替换时销毁彼此
    var contentEl = document.createElement('div');
    contentEl.innerHTML = '<span class="cursor"></span>';
    bubble.appendChild(contentEl);
    var acc = '';
    var thinkEl = null, thinkBody = null, thinkAcc = '';
    var first = true;
    ctrl = new AbortController();

    fetch('/v1/chat/completions', {
      method: 'POST', headers: headers(), signal: ctrl.signal,
      body: JSON.stringify({ stream: true, model: document.getElementById('modelSel').value, messages: history })
    }).then(function (res) {
      if (!res.ok) {
        return res.json().catch(function () { return null; }).then(function (j) {
          throw new Error((j && j.error && j.error.message) || ('HTTP ' + res.status));
        });
      }
      var reader = res.body.getReader();
      var dec = new TextDecoder('utf-8');
      var buf = '';
      function pump() {
        return reader.read().then(function (r) {
          if (r.done) return;
          buf += dec.decode(r.value, { stream: true });
          var nl;
          while ((nl = buf.indexOf('\n')) >= 0) {
            var line = buf.substring(0, nl).replace(/\r$/, '');
            buf = buf.substring(nl + 1);
            if (!line.startsWith('data:')) continue;
            var payload = line.substring(5).trim();
            if (!payload || payload === '[DONE]') continue;
            try {
              var j = JSON.parse(payload);
              if (j.error) throw new Error(j.error.message || 'upstream error');
              var d = j.choices && j.choices[0] && j.choices[0].delta;
              if (d && d.reasoning) {
                if (!thinkEl) {
                  thinkEl = document.createElement('details');
                  thinkEl.className = 'think';
                  thinkEl.open = true;
                  thinkEl.innerHTML = '<summary>思考过程</summary><div class="think-body" style="color:var(--dim); font-size:12px; white-space:pre-wrap;"></div>';
                  bubble.insertBefore(thinkEl, contentEl);
                  thinkBody = thinkEl.querySelector('.think-body');
                }
                thinkAcc += d.reasoning;
                thinkBody.textContent = thinkAcc;
                thinkEl.open = true;
                log.scrollTop = log.scrollHeight;
              }
              if (d && d.content) {
                if (thinkEl) thinkEl.open = false;
                if (first) { statusEl.textContent = ''; first = false; }
                acc += d.content;
                contentEl.innerHTML = render(acc) + '<span class="cursor"></span>';
                log.scrollTop = log.scrollHeight;
              }
            } catch (e) { if (e.message && e.message.indexOf('upstream') >= 0) throw e; }
          }
          return pump();
        });
      }
      return pump();
    }).then(function () {
      contentEl.innerHTML = render(acc) || '(空回复)';
      if (acc) history.push({ role: 'assistant', content: acc });
      autoSaveSession();
      finish();
    }).catch(function (e) {
      var aborted = e.name === 'AbortError';
      bubble.remove();
      addMsg(aborted ? 'sys' : 'err', aborted ? '已停止。' : ('错误: ' + e.message));
      if (!aborted) history.pop();
      finish();
    });

    function finish() { setBusy(false); ctrl = null; statusEl.textContent = ''; }
  }

  stopBtn.addEventListener('click', function () { if (ctrl) ctrl.abort(); });
  sendBtn.addEventListener('click', send);
  function postOpen(target) {
    fetch('/api/open', { method: 'POST', headers: headers(), body: JSON.stringify({ target: target }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error((res.j && res.j.error && res.j.error.message) || 'HTTP ' + res.status);
        addMsg('sys', '已在服务器上打开' + (res.j.target === 'workspace' ? '工作区文件夹' : '配置文件') + ': ' + res.j.path);
      })
      .catch(function (e) { addMsg('err', '打开失败: ' + e.message); });
  }
  document.getElementById('openWs').addEventListener('click', function () { postOpen('workspace'); });
  document.getElementById('openCfg').addEventListener('click', function () { postOpen('config'); });

  var histPanel = document.getElementById('histPanel');
  document.getElementById('hist').addEventListener('click', function () {
    if (histPanel.style.display === 'none') {
      histPanel.style.display = 'block';
      var list = document.getElementById('histList');
      list.textContent = '加载中…';
      fetch('/api/sessions', { headers: headers() })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          list.textContent = '';
          var ss = j.sessions || [];
          if (!ss.length) { list.textContent = '（暂无历史会话——REPL 里跑过任务或点保存后会出现）'; return; }
          ss.forEach(function (se) {
            var item = document.createElement('div');
            item.style.cssText = 'padding:6px 8px; cursor:pointer; border-bottom:1px solid var(--line);';
            item.textContent = (se.savedAt || '?') + ' · ' + se.turns + ' 轮 · ' + (se.preview || '(无预览)');
            item.addEventListener('click', function () { loadSessionFile(se.file); });
            list.appendChild(item);
          });
        })
        .catch(function (e) { list.textContent = '加载失败: ' + e.message; });
    } else {
      histPanel.style.display = 'none';
    }
  });
  document.getElementById('closeHist').addEventListener('click', function () { histPanel.style.display = 'none'; });
  // 自动保存: 每轮对话结束（助手回复完成）后自动存档，无需手动点击
  var autoSaving = false;
  function autoSaveSession() {
    if (autoSaving || !history.length) return;
    autoSaving = true;
    fetch('/api/sessions/save', { method: 'POST', headers: headers(), body: JSON.stringify({ messages: history }) })
      .then(function (r) { return r.json(); })
      .then(function () { autoSaving = false; })
      .catch(function () { autoSaving = false; });
  }
  // 页面关闭前兜底保存
  window.addEventListener('beforeunload', function () {
    if (history.length) autoSaveSession();
  });

  function loadSessionFile(file) {
    fetch('/api/sessions/load', { method: 'POST', headers: headers(), body: JSON.stringify({ file: file }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.error) throw new Error(j.error.message);
        history = j.messages.slice();
        while (log.children.length > 1) log.removeChild(log.lastChild);
        history.forEach(function (m) { addMsg(m.role === 'user' ? 'user' : 'bot', esc(m.content)); });
        addMsg('sys', '已载入历史会话（' + history.length + ' 轮），可继续对话。');
        histPanel.style.display = 'none';
      })
      .catch(function (e) { addMsg('err', '载入失败: ' + e.message); });
  }

  // ===== 模型设置面板 =====
  var setPanel = document.getElementById('setPanel');
  var profRows = document.getElementById('profRows');
  document.getElementById('settingsBtn').addEventListener('click', function () {
    if (setPanel.style.display === 'block') { setPanel.style.display = 'none'; return; }
    setPanel.style.display = 'block';
    fetch('/api/settings', { headers: headers() })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        document.getElementById('setEndpoint').value = j.endpoint || '';
        document.getElementById('setKey').value = j.apiKey || '';
        document.getElementById('setModel').value = j.model || '';
        renderProfRows(j.profiles || {});
      })
      .catch(function (e) { addMsg('err', '读取设置失败: ' + e.message); });
  });
  function renderProfRows(profiles) {
    profRows.textContent = '';
    Object.keys(profiles).forEach(function (name) {
      addProfRow(name, profiles[name].endpoint || '', profiles[name].apiKey || '');
    });
  }
  function addProfRow(name, endpoint, key) {
    var row = document.createElement('div');
    row.style.cssText = "display:grid; grid-template-columns: 140px 1fr 1fr 60px; gap:6px; margin-bottom:6px;";
    function mk(val, ph, isPw) {
      var inp = document.createElement('input');
      inp.value = val || ''; inp.placeholder = ph;
      if (isPw) inp.type = 'password';
      inp.style.cssText = "background:#10131a;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;";
      return inp;
    }
    var n = mk(name, '模型名', false); n.className = 'pf-name';
    var ep = mk(endpoint, 'endpoint', false); ep.className = 'pf-endpoint';
    var kk = mk(key, 'apiKey', true); kk.className = 'pf-key';
    var del = document.createElement('button');
    del.className = 'ghost'; del.textContent = '删除'; del.style.fontSize = '11px';
    del.addEventListener('click', function () { row.remove(); });
    row.appendChild(n); row.appendChild(ep); row.appendChild(kk); row.appendChild(del);
    profRows.appendChild(row);
  }
  document.getElementById('addProf').addEventListener('click', function () { addProfRow('', '', ''); });
  document.getElementById('saveProfiles').addEventListener('click', function () {
    var profiles = {};
    var rows = profRows.children;
    for (var i = 0; i < rows.length; i++) {
      var ins = rows[i].querySelectorAll('input');
      var name = ins[0].value.trim();
      if (!name) continue;
      profiles[name] = { endpoint: ins[1].value.trim(), apiKey: ins[2].value };
    }
    fetch('/api/models-config', { method: 'POST', headers: headers(), body: JSON.stringify({ profiles: profiles }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.error) throw new Error(j.error.message);
        addMsg('sys', '模型 Profiles 已保存并即时生效: ' + (j.models || []).join(', '));
        refreshInfo();
      })
      .catch(function (e) { addMsg('err', '保存失败: ' + e.message); });
  });
  document.getElementById('saveSettings').addEventListener('click', function () {
    var body = {
      endpoint: document.getElementById('setEndpoint').value.trim(),
      apiKey: document.getElementById('setKey').value,
      model: document.getElementById('setModel').value.trim()
    };
    fetch('/api/settings', { method: 'POST', headers: headers(), body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.error) throw new Error(j.error.message);
        addMsg('sys', '全局设置已保存并即时生效（endpoint/key/主模型，写入工作区 .env）。');
        refreshInfo();
      })
      .catch(function (e) { addMsg('err', '保存失败: ' + e.message); });
  });

  document.getElementById('new').addEventListener('click', function () {
    if (busy) { statusEl.textContent = '任务运行中，请先停止。'; return; }
    history = [];
    while (log.children.length > 1) log.removeChild(log.lastChild);
    addMsg('sys', '新会话已开始。');
  });
  ta.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  ta.addEventListener('input', function () {
    ta.style.height = 'auto';
    ta.style.height = Math.min(180, ta.scrollHeight) + 'px';
  });
})();
