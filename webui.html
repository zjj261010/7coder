<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7coder</title>
<style>
:root {
  --bg: #0d0f12;
  --side: #121418;
  --panel: #171a20;
  --card: #1c1f27;
  --line: #262b36;
  --fg: #dce0e8;
  --dim: #7d8590;
  --acc: #5b9cf5;
  --acc-dim: #2d4f7a;
  --user: #2d4a7a;
  --ok: #5cb85c;
  --err: #f05650;
  --warn: #e8a33d;
  --think: #9b7bbf;
  --code-bg: #0a0c10;
  --sidebar-w: 260px;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  display: flex; overflow: hidden; font-size: 14px;
}

/* ===== Sidebar ===== */
#sidebar {
  width: var(--sidebar-w); min-width: var(--sidebar-w);
  background: var(--side); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; overflow: hidden;
  transition: margin-left .2s ease;
}
#sidebar.hidden { margin-left: calc(-1 * var(--sidebar-w)); }
.side-head {
  padding: 14px 14px 10px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--line);
}
.side-head .logo { font-weight: 700; font-size: 15px; letter-spacing: .5px; }
.side-body { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.side-btn {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px;
  border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--fg);
  border: 1px solid transparent; transition: background .15s;
  background: transparent; text-align: left; width: 100%;
}
.side-btn:hover { background: var(--card); }
.side-btn.active { background: var(--acc-dim); }
.side-sep { border-top: 1px solid var(--line); margin: 6px 0; }
.side-label { font-size: 11px; color: var(--dim); padding: 8px 10px 4px; text-transform: uppercase; letter-spacing: .5px; }
.side-item {
  display: flex; align-items: center; gap: 6px; padding: 7px 10px;
  border-radius: 7px; font-size: 13px; cursor: pointer; color: var(--dim);
  transition: background .12s, color .12s;
}
.side-item:hover { background: var(--card); color: var(--fg); }
.side-item .del {
  margin-left: auto; opacity: 0; color: var(--err);
  font-size: 11px; padding: 2px 6px; border-radius: 4px;
  transition: opacity .15s;
}
.side-item:hover .del { opacity: .7; }
.side-item .del:hover { opacity: 1; background: rgba(240,86,80,.15); }
.side-foot { padding: 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.side-foot input, .side-foot select {
  width: 100%; background: var(--code-bg); color: var(--fg);
  border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 8px; font-size: 12px;
}
.side-foot label { font-size: 11px; color: var(--dim); display: block; margin-bottom: 3px; }

/* ===== Main ===== */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px; background: var(--side);
  border-bottom: 1px solid var(--line); min-height: 44px;
}
.topbar .burger { cursor: pointer; font-size: 18px; color: var(--dim); padding: 4px; }
.topbar .chip {
  font-size: 12px; color: var(--dim); background: var(--code-bg);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 2px 10px; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; max-width: 300px;
}
.topbar .chip.mode-chip { color: var(--acc); cursor: pointer; }
.topbar .spacer { flex: 1; }

/* ===== Messages ===== */
#log {
  flex: 1; overflow-y: auto; padding: 20px;
  display: flex; flex-direction: column; gap: 16px;
  scroll-behavior: smooth;
}
.msg-row { display: flex; flex-direction: column; max-width: 800px; width: 100%; margin: 0 auto; }
.msg-row.user { align-items: flex-end; }
.msg-row.bot { align-items: flex-start; }
.msg-label { font-size: 11px; color: var(--dim); margin-bottom: 4px; padding: 0 4px; }
.msg {
  padding: 12px 16px; border-radius: 12px; line-height: 1.7;
  font-size: 14px; white-space: pre-wrap; word-break: break-word;
}
.msg-row.user .msg { background: var(--user); border-bottom-right-radius: 4px; }
.msg-row.bot .msg { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.err-msg { background: #2a1518; border: 1px solid var(--err); color: var(--err); font-size: 13px; }
.msg.sys-msg { color: var(--dim); font-size: 12px; text-align: center; background: transparent; }
/* Streaming cursor (injected into .msg while deltas arrive, P2-16) */
.cursor {
  display: inline-block; width: 8px; height: 1em; margin-left: 2px;
  vertical-align: text-bottom; background: var(--acc); border-radius: 1px;
  animation: cursor-blink 1s steps(1) infinite;
}
@keyframes cursor-blink { 50% { opacity: 0; } }

/* Reasoning */
details.think {
  margin-bottom: 10px; border: 1px solid var(--line);
  border-radius: 8px; background: var(--code-bg); overflow: hidden;
}
details.think summary {
  padding: 6px 10px; cursor: pointer; color: var(--think);
  font-size: 12px; user-select: none; list-style: none;
}
details.think summary::before { content: "▸ "; }
details.think[open] summary::before { content: "▾ "; }
details.think .think-body {
  padding: 8px 12px; color: var(--think); font-size: 12px;
  white-space: pre-wrap; border-top: 1px solid var(--line);
  max-height: 300px; overflow-y: auto;
}

/* Code blocks */
.msg pre {
  background: var(--code-bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 12px; overflow-x: auto;
  white-space: pre; font-size: 13px; margin: 8px 0;
  font-family: Consolas, "Courier New", monospace;
  position: relative;
}
.msg pre .copy-btn {
  position: absolute; top: 6px; right: 6px;
  background: var(--card); color: var(--dim); border: 1px solid var(--line);
  border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer;
  opacity: 0; transition: opacity .15s;
}
.msg pre:hover .copy-btn { opacity: 1; }
.msg pre .copy-btn:hover { color: var(--fg); }
.msg code {
  font-family: Consolas, "Courier New", monospace;
  background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 13px;
}
.msg pre code { background: transparent; padding: 0; }

/* Message action buttons */
.msg-actions { display: flex; gap: 6px; margin-top: 6px; justify-content: flex-end; }
.msg-actions button {
  background: var(--code-bg); color: var(--dim); border: 1px solid var(--line);
  border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer;
}
.msg-actions button:hover { color: var(--fg); border-color: var(--dim); }

/* Tool call display */
.tool-call {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 10px; margin: 4px 0;
  background: var(--code-bg); border: 1px solid var(--line);
  border-radius: 6px; font-size: 12px; color: var(--dim);
}
.tool-call .icon { font-size: 14px; }

/* Approval buttons */
.approval-box {
  padding: 10px 14px; border-radius: 8px; margin: 8px 0;
  background: #2a2015; border: 1px solid var(--warn); font-size: 13px;
}
.approval-box .q { margin-bottom: 8px; }
.approval-box .btns { display: flex; gap: 8px; }
.approval-box .btns button {
  flex: 1; padding: 6px 12px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); font-size: 13px;
}
.approval-box .btns .approve { background: var(--ok); color: #fff; border: 0; }
.approval-box .btns .deny { background: var(--err); color: #fff; border: 0; }

/* ===== Composer ===== */
#composer-area { padding: 12px 16px 16px; background: var(--side); border-top: 1px solid var(--line); }
#composer-inner { max-width: 800px; margin: 0 auto; }
#status { font-size: 12px; color: var(--dim); min-height: 18px; margin-bottom: 6px; padding: 0 4px; }
#status .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--acc); margin-right: 6px; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
#row { display: flex; gap: 8px; align-items: flex-end; }
#ta {
  flex: 1; resize: none; background: var(--panel); color: var(--fg);
  border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 14px; font-size: 14px; font-family: inherit;
  min-height: 44px; max-height: 200px; line-height: 1.5;
  transition: border-color .15s;
}
#ta:focus { outline: none; border-color: var(--acc); }
#send, #stop {
  border: 0; border-radius: 10px; cursor: pointer;
  width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
  font-size: 18px; transition: opacity .15s, background .15s;
  flex-shrink: 0;
}
#send { background: var(--acc); color: #fff; }
#send:disabled { opacity: .35; cursor: default; }
#stop { background: var(--err); color: #fff; display: none; }
#hint { font-size: 11px; color: var(--dim); margin-top: 6px; text-align: center; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--dim); }

/* ===== Toast ===== */
#toast-area { position: fixed; top: 56px; right: 16px; z-index: 999; display: flex; flex-direction: column; gap: 6px; }
.toast {
  background: var(--card); border: 1px solid var(--line); color: var(--fg);
  padding: 8px 14px; border-radius: 8px; font-size: 13px;
  box-shadow: 0 4px 12px rgba(0,0,0,.4); animation: slidein .25s ease;
}
.toast.err { border-color: var(--err); color: var(--err); }
.toast.ok { border-color: var(--ok); }
@keyframes slidein { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ===== Typing dots ===== */
.typing { display: inline-flex; gap: 4px; padding: 4px 0; }
.typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); animation: blink 1.4s infinite both; }
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
</style>
</head>
<body>

<!-- ===== Sidebar ===== -->
<div id="sidebar">
  <div class="side-head">
    <span class="logo">7coder</span>
    <span style="font-size:11px;color:var(--dim);" id="ver"></span>
  </div>
  <div class="side-body">
    <div class="side-btn" id="btnNew">＋ 新对话</div>
    <div class="side-sep"></div>
    <div class="side-label">历史会话</div>
    <div id="histList" style="display:flex;flex-direction:column;gap:2px;"></div>
    <div class="side-sep"></div>
    <div class="side-label">任务</div>
    <div id="todoList" style="display:flex;flex-direction:column;gap:2px;"></div>
  </div>
  <div class="side-foot">
    <label>模型</label>
    <select id="modelSel"></select>
    <label>权限模式</label>
    <select id="modeSel">
      <option value="">权限模式…</option>
      <option value="default">default · 操作前询问</option>
      <option value="auto">auto · 自动放行</option>
      <option value="bypass">bypass · 全部直接执行</option>
      <option value="denial">denial · 全部拒绝</option>
    </select>
    <label>API Key</label>
    <input id="key" type="password" placeholder="未设可留空" autocomplete="off">
    <div class="side-sep"></div>
    <div class="side-btn" id="openWs">📁 打开工作区</div>
    <div class="side-btn" id="openCfg">⚙ 打开 .env</div>
    <div class="side-sep"></div>
    <div class="side-btn" id="settingsBtn">🔧 模型设置</div>
  </div>
</div>

<!-- Settings Panel -->
<div id="setPanel" style="display:none; position:fixed; top:0; right:0; width:400px; height:100%; background:var(--side); border-left:1px solid var(--line); z-index:100; padding:16px; overflow-y:auto; font-size:13px;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
    <strong>模型设置</strong>
    <button class="ghost" id="closeSet" style="background:none;border:none;color:var(--dim);cursor:pointer;font-size:16px;">✕</button>
  </div>
  <label style="display:block;margin:8px 0 3px;color:var(--dim);font-size:11px;">全局 Endpoint</label>
  <input id="setEndpoint" style="width:100%;background:var(--code-bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;">
  <label style="display:block;margin:8px 0 3px;color:var(--dim);font-size:11px;">全局 API Key</label>
  <input id="setKey" type="password" style="width:100%;background:var(--code-bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;">
  <label style="display:block;margin:8px 0 3px;color:var(--dim);font-size:11px;">主模型</label>
  <input id="setModel" style="width:100%;background:var(--code-bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;">
  <button id="saveSettings" style="width:100%;margin-top:10px;background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px;cursor:pointer;">保存全局设置</button>
  <div style="border-top:1px solid var(--line);margin:14px 0 8px;"></div>
  <strong style="font-size:12px;">模型 Profiles</strong>
  <div id="profRows" style="margin:8px 0;"></div>
  <button class="ghost" id="addProf" style="font-size:12px;padding:4px 10px;">＋添加</button>
  <button id="saveProfiles" style="font-size:12px;padding:4px 10px;margin-left:8px;background:var(--acc);color:#fff;border:0;border-radius:6px;cursor:pointer;">保存 Profiles</button>
</div>

<!-- ===== Main ===== -->
<div id="main">
  <div class="topbar">
    <span class="burger" id="burger">☰</span>
    <span class="chip" id="wsChip" title="工作区"></span>
    <span class="chip mode-chip" id="modeChip"></span>
    <span class="spacer"></span>
    <span class="chip" id="statusChip"></span>
  </div>
  <div id="log">
    <div class="msg-row bot"><div class="msg-label">7coder</div><div class="msg">你好！输入任务开始，支持中文。</div></div>
  </div>
  <div id="composer-area">
    <div id="composer-inner">
      <div id="status"></div>
      <div id="row">
        <textarea id="ta" rows="1" placeholder="输入任务…（Enter 发送 / Shift+Enter 换行）"></textarea>
        <button id="send" title="发送 (Enter)">➤</button>
        <button id="stop" title="停止" style="display:none;">■</button>
      </div>
      <div id="hint">工具（写文件/命令等）在服务器端的工作区内执行 · 审计日志写入 .7coder/audit.jsonl</div>
    </div>
  </div>
</div>

<div id="toast-area"></div>

<script>
(function () {
  'use strict';
  /* ===== Helpers ===== */
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function toast(msg, cls) {
    var t = document.createElement('div');
    t.className = 'toast' + (cls ? ' ' + cls : '');
    t.textContent = msg;
    $('toast-area').appendChild(t);
    setTimeout(function () { t.remove(); }, 3500);
  }
  function headers() {
    var h = { 'Content-Type': 'application/json' };
    var k = $('key').value;
    if (k) h.Authorization = 'Bearer ' + k;
    return h;
  }

  /* ===== State ===== */
  var history = [];
  var busy = false;
  var ctrl = null;
  var sessFile = null;
  var autoSaving = false;
  var mode = 'auto';

  /* ===== Markdown-lite ===== */
  function render(text) {
    var t = esc(text);
    var blocks = [];
    t = t.replace(/```(\w*)\n([\s\S]*?)```/g, function (_, lang, code) {
      var idx = blocks.length;
      blocks.push('<pre><code>' + code.replace(/\n$/, '') + '</code></pre>');
      return '\u0000B' + idx + '\u0000';
    });
    t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    t = t.split('\n').join('<br>');
    t = t.replace(/\u0000B(\d+)\u0000/g, function (_, i) { return blocks[+i]; });
    return t;
  }

  /* ===== Message rendering ===== */
  function addCopyBtn(pre) {
    var btn = document.createElement('button');
    btn.className = 'copy-btn'; btn.textContent = '复制';
    btn.addEventListener('click', function () {
      var code = pre.querySelector('code');
      if (code) { navigator.clipboard.writeText(code.textContent); btn.textContent = '✓'; setTimeout(function () { btn.textContent = '复制'; }, 1200); }
    });
    pre.appendChild(btn);
  }
  function enhancePre(root) {
    var pres = root.querySelectorAll ? root.querySelectorAll('pre') : [];
    for (var i = 0; i < pres.length; i++) addCopyBtn(pres[i]);
  }
  function addMsg(type, html) {
    var row = document.createElement('div');
    row.className = 'msg-row ' + (type === 'user' ? 'user' : type === 'bot' ? 'bot' : '');
    var label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = type === 'user' ? '你' : type === 'bot' ? '7coder' : '';
    var msg = document.createElement('div');
    msg.className = 'msg' + (type === 'err' ? ' err-msg' : type === 'sys' ? ' sys-msg' : '');
    // A2-04: err/sys bubbles carry upstream/tool error text - render the body
    // as plain text (textContent), never HTML, so a hostile message like
    // '<img src=x onerror=...>' cannot execute. Only user/bot bubbles take
    // the markdown render path.
    if (type === 'user' || type === 'bot') { msg.innerHTML = html; }
    else { msg.textContent = html; }
    if (type === 'sys') { row.appendChild(msg); }
    else { row.appendChild(label); row.appendChild(msg); }
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    enhancePre(msg);
    return msg;
  }

  /* ===== Elements ===== */
  var log = $('log'), ta = $('ta'), sendBtn = $('send'), stopBtn = $('stop'),
      statusEl = $('status'), keyInput = $('key'), modelSel = $('modelSel'),
      modeSel = $('modeSel'), modeChip = $('modeChip'), sidebar = $('sidebar');

  /* ===== Session persistence ===== */
  function autoSaveSession() {
    if (autoSaving || !history.length) return;
    autoSaving = true;
    var msgs = history.slice();
    // 首存不带 file：服务端生成 web-*.json 并在响应里返回，再由 rememberSessFile 记住
    var body = { messages: msgs };
    if (sessFile) body.file = sessFile;
    fetch('/api/sessions/save', { method: 'POST', headers: headers(), body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j.file) rememberSessFile(j.file); autoSaving = false; refreshTodos(); })
      .catch(function () { autoSaving = false; });
  }
  function rememberSessFile(f) { sessFile = f; try { localStorage.setItem('7coder-sess-file', f); } catch (e) {} }
  function forgetSessFile() { sessFile = null; try { localStorage.removeItem('7coder-sess-file'); } catch (e) {} }

  /* ===== Sidebar: sessions ===== */
  function refreshSessions() {
    fetch('/api/sessions', { headers: headers() }).then(function (r) { return r.json(); }).then(function (j) {
      var list = $('histList');
      list.textContent = '';
      var ss = j.sessions || [];
      if (!ss.length) { list.innerHTML = '<span style="color:var(--dim);font-size:12px;padding:4px 10px;">暂无</span>'; return; }
      ss.forEach(function (se) {
        var item = document.createElement('div');
        item.className = 'side-item';
        var info = document.createElement('span');
        info.textContent = (se.preview || '(空)').substring(0, 30);
        info.style.flex = '1'; info.style.overflow = 'hidden'; info.style.textOverflow = 'ellipsis';
        info.title = se.savedAt || '';
        info.addEventListener('click', function () { loadSessionFile(se.file); });
        var del = document.createElement('span');
        del.className = 'del'; del.textContent = '✕';
        del.addEventListener('click', function (e) {
          e.stopPropagation();
          fetch('/api/sessions/delete', { method: 'POST', headers: headers(), body: JSON.stringify({ file: se.file }) })
            .then(function (r) { return r.json(); })
            .then(function (j) { if (j.error) throw new Error(j.error.message); item.remove(); })
            .catch(function (e) { toast('删除失败: ' + e.message, 'err'); });
        });
        item.appendChild(info); item.appendChild(del);
        list.appendChild(item);
      });
    }).catch(function (e) { toast('会话列表加载失败', 'err'); });
  }

  /* ===== Sidebar: tasks (GAP-6) ===== */
  var TODO_COLORS = { pending: '#b58900', doing: '#268bd2', done: '#2aa198' };
  function refreshTodos() {
    fetch('/api/todos', { headers: headers() }).then(function (r) { return r.json(); }).then(function (j) {
      var list = $('todoList');
      list.textContent = '';
      var ts = j.todos || [];
      if (!ts.length) { list.innerHTML = '<span style="color:var(--dim);font-size:12px;padding:4px 10px;">暂无</span>'; return; }
      ts.forEach(function (t) {
        var item = document.createElement('div');
        item.className = 'side-item';
        var badge = document.createElement('span');
        badge.textContent = t.status;
        badge.style.cssText = 'font-size:10px;padding:1px 6px;border-radius:8px;color:#fff;background:' + (TODO_COLORS[t.status] || '#93a1a1') + ';margin-right:6px;flex:none;';
        var title = document.createElement('span');
        title.textContent = t.title;
        title.style.cssText = 'flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;' + (t.status === 'done' ? 'text-decoration:line-through;color:var(--dim);' : '');
        item.appendChild(badge);
        item.appendChild(title);
        list.appendChild(item);
      });
    }).catch(function (e) { /* 任务面板失败不打扰聊天 */ });
  }

  function loadSessionFile(file) {
    fetch('/api/sessions/load', { method: 'POST', headers: headers(), body: JSON.stringify({ file: file }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.error) throw new Error(j.error.message);
        history = j.messages.slice();
        rememberSessFile(file);
        log.textContent = '';
        history.forEach(function (m) { addMsg(m.role === 'user' ? 'user' : 'bot', esc(m.content)); });
        addMsg('sys', '已载入（' + history.length + ' 轮）');
        refreshSessions();
      })
      .catch(function (e) { toast('载入失败: ' + e.message, 'err'); });
  }

  /* ===== Send ===== */
  function send() {
    if (busy) return;
    var text = ta.value.trim();
    if (!text) return;
    ta.value = ''; ta.style.height = 'auto';
    addMsg('user', esc(text));
    history.push({ role: 'user', content: text });
    setBusy(true);
    statusEl.innerHTML = '<span class="dot"></span>思考中 / 工具执行中…';
    var row = document.createElement('div');
    row.className = 'msg-row bot';
    var label = document.createElement('div'); label.className = 'msg-label'; label.textContent = '7coder';
    var bubble = document.createElement('div'); bubble.className = 'msg';
    row.appendChild(label); row.appendChild(bubble);
    log.appendChild(row); log.scrollTop = log.scrollHeight;

    var contentEl = document.createElement('div');
    contentEl.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
    bubble.appendChild(contentEl);
    var thinkEl = null, thinkBody = null, thinkAcc = '';
    var acc = '';
    var first = true;
    ctrl = new AbortController();

    fetch('/v1/chat/completions', {
      method: 'POST', headers: headers(), signal: ctrl.signal,
      body: JSON.stringify({ stream: true, model: modelSel.value, messages: history })
    }).then(function (res) {
      if (!res.ok) {
        return res.json().catch(function () { return null; }).then(function (j) {
          throw new Error((j && j.error && j.error.message) || ('HTTP ' + res.status));
        });
      }
      var reader = res.body.getReader();
      var dec = new TextDecoder('utf-8');
      var buf = '';
      function pump() {
        return reader.read().then(function (r) {
          if (r.done) return;
          buf += dec.decode(r.value, { stream: true });
          var nl;
          while ((nl = buf.indexOf('\n')) >= 0) {
            var line = buf.substring(0, nl).replace(/\r$/, '');
            buf = buf.substring(nl + 1);
            if (!line.startsWith('data:')) continue;
            var payload = line.substring(5).trim();
            if (!payload || payload === '[DONE]') continue;
            var j;
            try { j = JSON.parse(payload); } catch (pe) { continue; } // 非法 JSON 行：无害，跳过
            if (j.error) throw new Error(j.error.message || 'upstream error'); // 业务错误：原样上抛给外层 .catch 展示
            var d = j.choices && j.choices[0] && j.choices[0].delta;
            if (d && d.reasoning) {
              if (!thinkEl) {
                thinkEl = document.createElement('details');
                thinkEl.className = 'think'; thinkEl.open = true;
                thinkEl.innerHTML = '<summary>思考过程</summary><div class="think-body"></div>';
                thinkBody = thinkEl.querySelector('.think-body');
                bubble.insertBefore(thinkEl, contentEl);
              }
              thinkAcc += d.reasoning;
              thinkBody.textContent = thinkAcc;
              log.scrollTop = log.scrollHeight;
            }
            if (d && d.tool_call) {
              var tcDiv = document.createElement('div');
              tcDiv.className = 'tool-call';
              tcDiv.innerHTML = '<span class="icon">🔧</span> ' + esc(d.tool_call.name || 'tool');
              contentEl.parentNode.insertBefore(tcDiv, contentEl);
              log.scrollTop = log.scrollHeight;
            }
            if (j.approval_request) {
              handleApproval(j.approval_request);
            }
            if (d && d.content) {
              if (first) { statusEl.textContent = ''; first = false; if (thinkEl) thinkEl.open = false; }
              acc += d.content;
              contentEl.innerHTML = render(acc) + '<span class="cursor"></span>';
              log.scrollTop = log.scrollHeight;
            }
          }
          return pump();
        });
      }
      return pump();
    }).then(function () {
      contentEl.innerHTML = render(acc) || '(空回复)';
      enhancePre(contentEl);
      if (acc) history.push({ role: 'assistant', content: acc });
      autoSaveSession();
      finish();
    }).catch(function (e) {
      var aborted = e.name === 'AbortError';
      bubble.remove();
      if (!aborted) addMsg('err', '错误: ' + e.message);
      if (!aborted && history.length && history[history.length - 1].role === 'user') history.pop();
      finish();
    });

    function finish() { setBusy(false); ctrl = null; statusEl.textContent = ''; refreshSessions(); }

    // 审批处理: SSE 收到 approval_request 时显示按钮并等待用户操作
    function handleApproval(req) {
      var box = document.createElement('div');
      box.className = 'approval-box';
      box.innerHTML = '<div class="q">' + esc(req.question) + '</div>' +
        '<span class="approval-cd">剩余 120 秒</span>' +
        '<div class="btns"><button class="approve">✓ 批准</button><button class="deny">✗ 拒绝</button></div>';
      bubble.appendChild(box);
      log.scrollTop = log.scrollHeight;
      // P2-12: 服务端 120 秒无操作会自动拒绝 - 前端同拍倒计时提示
      var cdLeft = 120;
      var cdSpan = box.querySelector('.approval-cd');
      var cdTimer = setInterval(function () {
        cdLeft -= 1;
        if (cdLeft <= 0) {
          clearInterval(cdTimer);
          cdSpan.textContent = '已超时自动拒绝';
          var ab = box.querySelector('.approve'), db = box.querySelector('.deny');
          if (ab) ab.disabled = true;
          if (db) db.disabled = true;
        } else {
          cdSpan.textContent = '剩余 ' + cdLeft + ' 秒';
        }
      }, 1000);
      var clearCd = function () { if (cdTimer) { clearInterval(cdTimer); cdTimer = null; } };
      box.querySelector('.approve').addEventListener('click', function () {
        clearCd();
        respondApproval(req.id, true, box);
      });
      box.querySelector('.deny').addEventListener('click', function () {
        clearCd();
        respondApproval(req.id, false, box);
      });
    }
    function respondApproval(id, approved, box) {
      box.querySelector('.btns').innerHTML = approved ? '<span style="color:var(--ok)">✓ 已批准</span>' : '<span style="color:var(--err)">✗ 已拒绝</span>';
      fetch('/api/approve', { method: 'POST', headers: headers(), body: JSON.stringify({ id: id, approved: approved }) })
        .catch(function (e) { addMsg('err', '审批发送失败: ' + e.message); });
    }
  }

  function setBusy(b) {
    busy = b;
    sendBtn.style.display = b ? 'none' : '';
    stopBtn.style.display = b ? '' : 'none';
    ta.focus();
  }

  /* ===== Init ===== */
  try { keyInput.value = localStorage.getItem('7coder-key') || ''; } catch (e) {}
  keyInput.addEventListener('change', function () {
    try { keyInput.value ? localStorage.setItem('7coder-key', keyInput.value) : localStorage.removeItem('7coder-key'); } catch (e) {}
  });

  function refreshInfo() {
    fetch('/api/info', { headers: headers() }).then(function (r) { return r.json(); }).then(function (info) {
      $('wsChip').textContent = '📁 ' + (info.workspace || '?');
      modeChip.textContent = '🔒 ' + (info.mode || '?');
      var sel = modelSel;
      sel.textContent = '';
      (info.models || [info.model || '']).forEach(function (m) {
        var opt = document.createElement('option');
        opt.value = m; opt.textContent = m;
        sel.appendChild(opt);
      });
      var saved = null;
      try { saved = localStorage.getItem('7coder-model'); } catch (e) {}
      if (saved && info.models.indexOf(saved) >= 0) sel.value = saved;
      else sel.value = info.model || '';
      // P1-3: 持久化模型选择 + 回显权限模式
      sel.addEventListener('change', function () {
        try { localStorage.setItem('7coder-model', sel.value); } catch (e) {}
      });
      if (info.mode) modeSel.value = info.mode;
      $('ver').textContent = 'v' + (info.version || '?');
    }).catch(function () { $('wsChip').textContent = '⚠ 服务器未连接'; });
  }
  refreshInfo();
  refreshTodos(); // GAP-6: 任务面板随页面打开加载一次，之后每次自动保存成功顺带刷新

  // 页面加载时自动载入最近的会话存档，刷新不丢上下文
  (function () {
    fetch('/api/sessions', { headers: headers() }).then(function (r) { return r.json(); }).then(function (j) {
      var ss = j.sessions || [];
      if (!ss.length) return;
      var target = null;
      try { target = localStorage.getItem('7coder-sess-file'); } catch (e) {}
      if (!target || !ss.some(function (s) { return s.file === target; })) target = ss[0].file;
      if (!target) return;
      fetch('/api/sessions/load', { method: 'POST', headers: headers(), body: JSON.stringify({ file: target }) })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j.error || !j.messages || !j.messages.length) return;
          history = j.messages.slice();
          rememberSessFile(target);
          history.forEach(function (m) {
            addMsg(m.role === 'user' ? 'user' : 'bot', esc(m.content));
          });
          addMsg('sys', '已恢复上次会话（' + history.length + ' 轮）。');
        })
        .catch(function () {});
    }).catch(function () {});
  })();

  /* ===== Event listeners ===== */
  sendBtn.addEventListener('click', send);
  stopBtn.addEventListener('click', function () { if (ctrl) ctrl.abort(); });
  ta.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  ta.addEventListener('input', function () {
    ta.style.height = 'auto';
    ta.style.height = Math.min(200, ta.scrollHeight) + 'px';
  });

  // ===== Settings Panel =====
  var setPanel = $('setPanel');
  var profRows = $('profRows');
  $('settingsBtn').addEventListener('click', function () {
    var visible = setPanel.style.display === 'block';
    setPanel.style.display = visible ? 'none' : 'block';
    if (!visible) {
      fetch('/api/settings', { headers: headers() })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          $('setEndpoint').value = j.endpoint || '';
          $('setKey').value = j.apiKey || '';
          $('setModel').value = j.model || '';
          renderProfRows(j.profiles || {});
        })
        .catch(function (e) { toast('读取设置失败: ' + e.message, 'err'); });
    }
  });
  $('closeSet').addEventListener('click', function () { setPanel.style.display = 'none'; });
  function renderProfRows(profiles) {
    profRows.textContent = '';
    Object.keys(profiles).forEach(function (name) {
      addProfRow(name, profiles[name].endpoint || '', profiles[name].apiKey || '');
    });
  }
  function addProfRow(name, endpoint, key) {
    var row = document.createElement('div');
    row.style.cssText = 'display:grid; grid-template-columns:1fr 1fr 1fr 40px; gap:4px; margin-bottom:4px;';
    function mk(val, ph, isPw) {
      var inp = document.createElement('input');
      inp.value = val || ''; inp.placeholder = ph;
      if (isPw) inp.type = 'password';
      inp.style.cssText = 'background:var(--code-bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:3px 5px;font-size:12px;';
      return inp;
    }
    var n = mk(name, '模型名'); n.dataset.role = 'name';
    var ep = mk(endpoint, 'endpoint');
    var kk = mk(key, 'apiKey', true);
    var del = document.createElement('button');
    del.textContent = '✕'; del.style.cssText = 'background:none;border:none;color:var(--err);cursor:pointer;';
    del.addEventListener('click', function () { row.remove(); });
    row.appendChild(n); row.appendChild(ep); row.appendChild(kk); row.appendChild(del);
    profRows.appendChild(row);
  }
  $('addProf').addEventListener('click', function () { addProfRow('', '', ''); });
  $('saveProfiles').addEventListener('click', function () {
    var profiles = {};
    var rows = profRows.children;
    for (var i = 0; i < rows.length; i++) {
      var ins = rows[i].querySelectorAll('input');
      var name = ins[0].value.trim();
      if (!name) continue;
      profiles[name] = { endpoint: ins[1].value.trim(), apiKey: ins[2].value };
    }
    fetch('/api/models-config', { method: 'POST', headers: headers(), body: JSON.stringify({ profiles: profiles }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.error) throw new Error(j.error.message);
        toast('Profiles 已保存并生效: ' + (j.models || []).join(', '), 'ok');
        refreshInfo();
      })
      .catch(function (e) { toast('保存失败: ' + e.message, 'err'); });
  });
  $('saveSettings').addEventListener('click', function () {
    var body = {
      endpoint: $('setEndpoint').value.trim(),
      apiKey: $('setKey').value,
      model: $('setModel').value.trim()
    };
    fetch('/api/settings', { method: 'POST', headers: headers(), body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.error) throw new Error(j.error.message);
        toast('全局设置已保存', 'ok');
        refreshInfo();
      })
      .catch(function (e) { toast('保存失败: ' + e.message, 'err'); });
  });
  $('burger').addEventListener('click', function () { sidebar.classList.toggle('hidden'); });
  $('btnNew').addEventListener('click', function () {
    if (busy) { toast('任务运行中，请先停止', 'err'); return; }
    history = [];
    forgetSessFile();
    log.textContent = '';
    addMsg('bot', '新对话已开始。');
    toast('新对话');
  });
  modeSel.addEventListener('change', function () {
    var m = modeSel.value;
    if (!m) return;
    if (m === 'bypass' && !confirm('bypass 模式下 AI 的所有操作（含删除文件、执行命令）都不再询问，直接执行。\n确定切换吗？')) { modeSel.value = ''; return; }
    fetch('/api/mode', { method: 'POST', headers: headers(), body: JSON.stringify({ mode: m }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.error) throw new Error(j.error.message);
        mode = j.mode;
        modeChip.textContent = '🔒 ' + j.mode;
        toast('权限模式: ' + j.mode, 'ok');
      })
      .catch(function (e) { toast('切换失败: ' + e.message, 'err'); modeSel.value = ''; });
  });
  $('openWs').addEventListener('click', function () {
    fetch('/api/open', { method: 'POST', headers: headers(), body: JSON.stringify({ target: 'workspace' }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j.ok) toast('已打开工作区', 'ok'); })
      .catch(function (e) { toast('打开失败: ' + e.message, 'err'); });
  });
  $('openCfg').addEventListener('click', function () {
    fetch('/api/open', { method: 'POST', headers: headers(), body: JSON.stringify({ target: 'config' }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j.ok) toast('已打开配置文件', 'ok'); })
      .catch(function (e) { toast('打开失败: ' + e.message, 'err'); });
  });

  /* ===== Expose to window for console access ===== */
  window.__7coder = { history: history, refreshInfo: refreshInfo };
})();
</script>
</body>
</html>
